name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # 1. Pruebas y Linter
  # -------------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/src/requirements.txt

      - name: Ejecutar pruebas unitarias
        run: |
          pytest app/src/test_app.py

  # -------------------------------------------------------------
  # 2. Análisis de Seguridad y Build de Docker
  # -------------------------------------------------------------
  build-and-scan:
    name: Build Image and Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local para análisis
        uses: docker/build-push-action@v5
        with:
          context: ./app/src
          load: true
          tags: api-devops:${{ github.sha }}

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-devops:${{ github.sha }}
          format: 'table'
          exit-code: '0' # Permite continuar el flujo registrando los hallazgos
          severity: 'CRITICAL,HIGH'

      - name: Login en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de la imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./app/src
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/mi-api-devops:latest
